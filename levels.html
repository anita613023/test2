<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>拆字試煉｜進階試煉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme: light;
      --bg-base: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
      --cyan: #0d9488;
      --panel: rgba(255, 255, 255, 0.85);
      --stage-bg: #ffffff;
      --border-color: rgba(15, 23, 42, 0.08);
      --font-sans: "Noto Sans TC", "Source Han Sans TC", system-ui, sans-serif;
      --font-serif: "Noto Serif TC", "Source Han Serif TC", serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      background:var(--bg-base);
      color:var(--ink);
      font-family:var(--font-sans);
      font-size:16px;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      background:radial-gradient(circle at 50% 35%, #e2e8f0 0, transparent 60%), linear-gradient(135deg, #f8fafc, #edf2f7 65%);
      z-index:-1;
    }
    main{min-height:100svh;display:flex;flex-direction:column;padding:clamp(16px,3vw,34px);gap:16px}
    header,.toolbar,.controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
    .brand{font-size:.85rem;font-weight:700;letter-spacing:.18em;color:var(--ink)}.step{color:var(--muted);font-size:.85rem}.step b{color:var(--cyan)}
    a{color:var(--muted);font-size:.875rem;text-underline-offset:4px}
    a:hover{color:var(--cyan)}
    
    .toolbar{width:min(100%,1100px);margin:0 auto}
    nav{display:flex;gap:8px;flex-wrap:wrap}
    label{font-size:.875rem;color:var(--muted)}
    
    button,select{
      appearance:none;
      border:1px solid var(--border-color);
      background:var(--panel);
      color:var(--ink);
      border-radius:999px;
      padding:.72rem 1.1rem;
      font-family:var(--font-sans);
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      backdrop-filter:blur(12px);
      box-shadow:0 2px 8px rgba(15, 23, 42, 0.04);
      transition:all .2s ease;
    }
    select{font-size:.875rem;margin-left:8px;padding:.6rem .85rem}
    button:hover,select:hover{border-color:var(--cyan);color:var(--cyan);background:#ffffff}
    button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
    button:disabled{opacity:.45;cursor:default}
    button.active{border-color:var(--cyan);background:var(--cyan);color:#ffffff}
    #camera,#mic,#next{background:var(--ink);color:#ffffff;border-color:transparent;box-shadow:0 4px 12px rgba(15, 23, 42, 0.15)}
    #camera:hover,#mic:hover,#next:hover{background:#1e293b;color:#ffffff}
    
    #stage{
      position:relative;
      flex:1;
      width:min(100%,1100px);
      min-height:460px;
      margin:0 auto;
      border:1px solid var(--border-color);
      border-radius:24px;
      overflow:hidden;
      background:var(--stage-bg);
      box-shadow:0 20px 50px rgba(15, 23, 42, 0.06);
    }
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.18;filter:saturate(.25) contrast(1.15)}
    .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.6),transparent 35%,transparent 65%,rgba(255,255,255,.6));pointer-events:none}
    #content{position:absolute;inset:0;z-index:1}
    
    #letters{
      position:absolute;
      left:50%;
      top:42%;
      transform:translate(-50%,-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.08em;
      white-space:nowrap;
      font-family:var(--font-serif) !important;
      font-size:clamp(6rem,18vw,12rem);
      font-weight:900;
      line-height:1;
      color:var(--ink);
      text-shadow:0 8px 30px rgba(15, 23, 42, 0.12);
      user-select:none;
      pointer-events:none;
      will-change:transform;
    }
    #letters span{display:inline-block;transition:transform .15s;font-family:var(--font-serif) !important;}
    #letters.solved{color:var(--cyan);animation:pop .5s}
    
    .message{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);text-align:center;width:min(90%,640px)}
    h1{margin:0;font-size:clamp(1.1rem,2.4vw,1.55rem);font-family:var(--font-sans);color:var(--ink)}
    #hint{margin:.45rem 0 .8rem;color:var(--muted);font-size:.95rem;line-height:1.6;font-family:var(--font-sans)}
    
    progress{display:block;width:min(220px,70%);height:6px;margin:12px auto;accent-color:var(--cyan);border:0;border-radius:8px;overflow:hidden;background:#e2e8f0}
    progress::-webkit-progress-bar{background:#e2e8f0}
    progress::-webkit-progress-value{background:var(--cyan)}
    progress::-moz-progress-bar{background:var(--cyan)}
    
    #feedback{font-size:.875rem;line-height:1.5;color:var(--muted);min-height:1.5em;margin:8px 0 0;font-family:var(--font-sans)}
    .controls{justify-content:flex-start;gap:8px}
    .note{font-size:.875rem;line-height:1.5;color:var(--muted);margin:0;max-width:1100px;font-family:var(--font-sans)}
    [hidden]{display:none!important}
    
    @keyframes pop{50%{transform:translate(-50%,-50%) scale(1.1)}}
    @media(max-width:700px){main{padding:12px;gap:12px}#stage{min-height:440px}.message{bottom:18px}#hint{font-size:.875rem}.toolbar{align-items:flex-start}nav button{padding:.55rem .8rem;font-size:.875rem}.controls button{font-size:.875rem}#letters{top:38%}}
  </style>
  <link rel="stylesheet" href="interaction.css">
  <script src="interaction.js"></script>
  <link rel="stylesheet" href="extra-levels.css">
  <script src="extra-levels.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <header>
      <div class="brand">拆字試煉</div>
      <div class="step" id="level-label">第二關 <b>人＋木 → 休</b></div>
    </header>
    <div class="toolbar">
      <!-- 使用相對路徑 index.html，確保在 GitHub Pages 與 Vercel 正確跳轉 -->
      <a href="index.html">回到第一關：森</a>
      <label>提示難度 
        <select id="difficulty">
          <option value="easy">入門・跟著做</option>
          <option value="mid">進階・想一想</option>
          <option value="hard">挑戰・試一試</option>
        </select>
      </label>
      <nav aria-label="選擇關卡">
        <button data-level="0">第二關 休</button>
        <button data-level="1">第三關 鳴</button>
        <button data-level="2">第四關 開／關</button>
        <button data-level="3">第五關 看</button>
        <button data-level="4">第六關 明</button>
        <button data-level="5">第七關 囚</button>
        <button data-level="6">第八關 岩</button>
      </nav>
    </div>
    <section id="stage">
      <video id="video" autoplay muted playsinline></video>
      <div class="shade"></div>
      <div id="content">
        <div id="letters"></div>
        <div class="message">
          <h1 id="title"></h1>
          <p id="hint"></p>
          <progress id="progress" max="1" value="0" aria-label="完成進度"></progress>
          <p id="feedback" role="status"></p>
        </div>
      </div>
    </section>
    <div class="controls">
      <button id="camera">開啟攝影機</button>
      <button id="mic" hidden>開啟麥克風</button>
      <button id="speak">聽提示</button>
      <button id="demo">模擬動作</button>
      <button id="reset">重玩本關</button>
      <button id="next" hidden>下一關</button>
    </div>
    <p class="note">聲音關卡採用數位增益麥克風感測，說話、發出聲音即可觸發。攝影機與麥克風資料僅在瀏覽器內處理。</p>
  </main>

  <script>
    const $=id=>document.getElementById(id);
    const levels=[
      {word:'休',parts:'人 木',title:'累了，在哪裡休息呢？',easy:'身體向畫面右邊的樹側靠，停留一秒。',mid:'讓畫面中的人靠著樹休息。',hard:'幫累累的人找個地方休息。',done:'人靠著樹休息，休息的休。'},
      {word:'鳴',parts:'口 鳥',title:'發出聲音，讓小鳥回應你',easy:'開啟麥克風，對著螢幕發出聲音（說話、唱歌或呼喊）。',mid:'小鳥想聽見你的聲音。',hard:'用聲音叫醒小鳥吧。',done:'鳥用口發出聲音，鳥鳴的鳴。'},
      {word:'開／關',parts:'門',title:'請把門打開',easy:'先把雙手放在胸前，再向兩側張開；最後合攏雙手關門。',mid:'用雙手示範開門，再把門關好。',hard:'請進，再幫忙把門關好。',done:'張開、合攏：開門和關門。這一關認識字的意思。'}
    ];
    levels.push(...extraLevels);

    let level=0,done=false,door=0,amount=0,lastTime=0,pose=null,camStream=null;
    let micStream=null,audio=null,gainNode=null,analyser=null,micData=null,micStarting=false;
    let previous=0;

    function stopMic(){
      if(micStream) micStream.getTracks().forEach(t=>t.stop());
      micStream=null;
      if(audio) audio.close();
      audio=null;
      gainNode=null;
      analyser=null;
      micData=null;
      $('mic').disabled=false;
      $('mic').textContent='開啟麥克風';
      $('letters').style.transform = 'translate(-50%, -50%)';
    }

    function hint(){if(!done)$('hint').textContent=levels[level][$('difficulty').value]}

    function openLevel(n){
      stopMic();level=n;done=false;door=0;amount=0;lastTime=0;resetExtra();
      const l=levels[n];
      $('level-label').innerHTML=['第二關 <b>人＋木 → 休</b>','第三關 <b>口＋鳥 → 鳴</b>','第四關 <b>開／關</b>','第五關 <b>手＋目 → 看</b>','第六關 <b>日＋月 → 明</b>','第七關 <b>囗＋人 → 囚</b>','第八關 <b>岩 − 山 → 石</b>'][n];
      $('letters').className='';
      $('letters').innerHTML=l.parts.split(' ').map(x=>'<span>'+x+'</span>').join('');$('title').textContent=l.title;
      hint();
      $('progress').value=0;
      $('feedback').textContent=n===1?'點擊下方「開啟麥克風」，隨意發出聲音互動。':'可使用攝影機，也可以按模擬動作試玩。';
      $('next').hidden=true;$('mic').hidden=n!==1;$('camera').hidden=(n===1);$('demo').disabled=false;
      document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',+b.dataset.level===n));
      if(n>=3)setupExtra();
    }

    function finish(){
      done=true;clearExtraVisuals();
      $('letters').textContent=level===2?'關':levels[level].word;
      $('letters').className='solved';$('title').textContent='完成了！';
      $('hint').textContent=levels[level].done;
      $('progress').value=1;
      $('feedback').textContent=level===levels.length-1?'全部完成！可以回到第一關再挑戰一次。':'太棒了，準備前往下一關！';
      $('next').hidden=false;
      $('next').textContent=level===levels.length-1?'回到第一關':'下一關';
      $('demo').disabled=true;
      stopMic();
    }

    function act(){
      if(done)return;
      if(level>=3){extraAct();return}
      if(level===2&&door===0){
        door=1;amount=0;$('letters').textContent='開';
        $('title').textContent='門開了！再把門關好';
        $('progress').value=0;
        $('feedback').textContent='把雙手慢慢合攏。';
        return;
      }
      finish();
    }

    function accumulate(active,dt){
      if(done)return;
      amount=Math.max(0,Math.min(1,amount+(active?dt*1.2:-dt*.4)));
      $('progress').value=amount;
      if(amount>=1)act();
    }

    function results(r){
      handNext(r.poseLandmarks);
      if(done||level===1)return;
      const lm=r.poseLandmarks,now=performance.now(),dt=Math.min(.1,(now-lastTime)/1000||0);
      lastTime=now;
      if(!lm){
        document.querySelectorAll('.gesture-dot').forEach(d=>d.hidden=true);
        amount=0;$('progress').value=0;extraState.grab=null;
        $('feedback').textContent='請讓肩膀和雙手出現在鏡頭中。';
        return;
      }
      if(level>=3){extraResults(lm,dt);return}
      const valid=ids=>ids.every(i=>lm[i]&&(lm[i].visibility??0)>.6);
      if(level===0){
        if(!valid([11,12,23,24])){accumulate(false,dt);$('feedback').textContent='退後一點，讓肩膀到腰部都入鏡。';return}
        const shoulder=(lm[11].x+lm[12].x)/2,hip=(lm[23].x+lm[24].x)/2,width=Math.max(.08,Math.abs(lm[11].x-lm[12].x)),lean=(hip-shoulder)/width;
        const s=$('letters').firstElementChild;
        if(s)s.style.transform='translateX('+Math.max(0,Math.min(35,lean*70))+'px) rotate('+Math.max(-15,Math.min(15,lean*30))+'deg)';
        $('feedback').textContent='向畫面右邊側靠，慢慢來。';
        accumulate(lean>.22,dt);
      }else{
        if(!valid([11,12,15,16])){accumulate(false,dt);$('feedback').textContent='請讓兩隻手和肩膀都入鏡。';return}
        const width=Math.max(.08,Math.abs(lm[11].x-lm[12].x)),gap=Math.abs(lm[15].x-lm[16].x)/width;
        accumulate(door===0?gap>1.8:gap<.55,dt);
        $('feedback').textContent=door===0?'張開雙手，維持一下。':'合攏雙手，維持一下。';
      }
    }

    $('camera').onclick=async()=>{
      try{
        $('camera').disabled=true;
        $('feedback').textContent='正在準備攝影機…';
        if(!window.Pose)throw Error('模型未載入');
        camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
        $('video').srcObject=camStream;
        await $('video').play();
        pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f});
        pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:.55,minTrackingConfidence:.55});
        pose.onResults(results);
        $('camera').textContent='攝影機已開啟';
        async function frame(){
          try{
            await pose.send({image:$('video')});
            requestAnimationFrame(frame);
          }catch(e){
            $('feedback').textContent='追蹤中斷，請重新整理後再試。';
            camStream?.getTracks().forEach(t=>t.stop());
          }
        }
        frame();
      }catch(e){
        camStream?.getTracks().forEach(t=>t.stop());
        $('camera').disabled=false;
        $('feedback').textContent='無法開啟攝影機，請檢查權限與網路，或先使用模擬動作。';
      }
    };

    $('mic').onclick=async()=>{
      if(micStarting) return;
      micStarting=true;
      const requestedLevel=level;

      try{
        $('mic').disabled=true;
        const stream=await navigator.mediaDevices.getUserMedia({
          audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:true }
        });

        if(level!==requestedLevel||done){
          stream.getTracks().forEach(t=>t.stop());
          return;
        }

        micStream=stream;
        audio=new (window.AudioContext||window.webkitAudioContext)();
        if(audio.state==='suspended') await audio.resume();

        const source=audio.createMediaStreamSource(stream);
        gainNode=audio.createGain();
        gainNode.gain.value = 4.0;

        analyser=audio.createAnalyser();
        analyser.fftSize=256;
        analyser.smoothingTimeConstant=0.15;

        source.connect(gainNode);
        gainNode.connect(analyser);

        micData=new Uint8Array(analyser.frequencyBinCount);
        previous=performance.now();

        $('mic').textContent='麥克風收音中…';
        $('feedback').textContent='聽到了！發出聲音讓「口」與「鳥」結合！';

        function listen(now){
          if(!analyser||level!==1||done) return;
          const dt=Math.min(.1,(now-previous)/1000);
          previous=now;

          analyser.getByteFrequencyData(micData);
          let sum=0;
          for(let i=0;i<micData.length;i++) sum+=micData[i];
          const avg=sum/micData.length;

          const effectiveVol=Math.max(0, avg-6);
          const isVoicing = effectiveVol > 12;

          if(effectiveVol > 5){
            const shakeX = (Math.random()-0.5) * Math.min(16, effectiveVol * 0.4);
            const shakeY = (Math.random()-0.5) * Math.min(16, effectiveVol * 0.4);
            $('letters').style.transform = `translate(calc(-50% + ${shakeX.toFixed(1)}px), calc(-50% + ${shakeY.toFixed(1)}px))`;
          } else {
            $('letters').style.transform = 'translate(-50%, -50%)';
          }

          accumulate(isVoicing, dt);
          requestAnimationFrame(listen);
        }
        requestAnimationFrame(listen);

      }catch(e){
        stopMic();
        $('feedback').textContent='無法開啟麥克風，請檢查權限或使用模擬動作。';
      }finally{
        micStarting=false;
      }
    };

    $('speak').onclick=()=>{
      if(!('speechSynthesis'in window)){$('feedback').textContent='此瀏覽器未提供語音朗讀。';return}
      const text=done?levels[level].done:$('title').textContent+'。'+$('hint').textContent;
      const u=new SpeechSynthesisUtterance(text);
      u.lang='zh-TW';
      u.rate=.85;
      speechSynthesis.cancel();
      if(level===1&&micStream){stopMic();$('feedback').textContent='聽完提示後，再開啟麥克風。'}
      speechSynthesis.speak(u);
    };

    $('demo').onclick=act;
    $('reset').onclick=()=>openLevel(level);
    $('next').onclick=()=>level===levels.length-1?location.assign('index.html'):openLevel(level+1);$('difficulty').onchange=hint;
    document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>openLevel(+b.dataset.level));
    addEventListener('pagehide',()=>{stopMic();camStream?.getTracks().forEach(t=>t.stop())});

    const nextButton=$('next');
    nextButton.className='next-level';
    $('stage').append(nextButton);
    const handNext=createHandNext($('video'),nextButton);
    openLevel(0);
  </script>
</body>
</html>
