<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拆字試煉｜新的冒險</title>
<style>
:root{color-scheme:dark;--ink:#f6f0e4;--muted:#a7adbb;--cyan:#66e5d4;--panel:rgba(17,20,28,.78)}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#090b10;color:var(--ink);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;font-size:16px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#263244 0,transparent 48%),linear-gradient(135deg,#11141b,#07080b 65%);z-index:-1}
main{min-height:100svh;display:flex;flex-direction:column;padding:clamp(16px,3vw,34px);gap:16px}header,.toolbar,.controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{font-size:.85rem;font-weight:700;letter-spacing:.18em}.step{color:var(--muted);font-size:.85rem}.step b{color:var(--cyan)}a{color:var(--muted);font-size:.875rem;text-underline-offset:4px}
.toolbar{width:min(100%,1100px);margin:0 auto}nav{display:flex;gap:8px;flex-wrap:wrap}label{font-size:.875rem;color:var(--muted)}button,select{appearance:none;border:1px solid rgba(255,255,255,.18);background:var(--panel);color:var(--ink);border-radius:999px;padding:.72rem 1rem;font:inherit;font-weight:700;cursor:pointer;backdrop-filter:blur(12px)}select{font-size:.875rem;margin-left:8px;padding:.6rem .85rem}button:hover,select:hover{border-color:var(--cyan)}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}button:disabled{opacity:.45;cursor:default}button.active{border-color:var(--cyan);color:var(--cyan)}#camera,#mic,#next{background:var(--ink);color:#101116;border-color:transparent}
#stage{position:relative;flex:1;width:min(100%,1100px);min-height:460px;margin:0 auto;border:1px solid rgba(255,255,255,.14);border-radius:24px;overflow:hidden;background:#11151d;box-shadow:0 25px 80px rgba(0,0,0,.45)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.36;filter:saturate(.25) contrast(1.15)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,8,11,.5),transparent 35%,transparent 65%,rgba(7,8,11,.5));pointer-events:none}#content{position:absolute;inset:0;z-index:1}
#letters{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:.08em;white-space:nowrap;font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(6rem,18vw,12rem);font-weight:900;line-height:1;text-shadow:0 12px 40px #000;user-select:none;pointer-events:none}#letters span{display:inline-block;transition:transform .2s}#letters.solved{color:var(--cyan);animation:pop .5s}.message{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);text-align:center;width:min(90%,640px)}h1{margin:0;font-size:clamp(1.1rem,2.4vw,1.55rem)}#hint{margin:.45rem 0 .8rem;color:var(--muted);font-size:.95rem;line-height:1.6}progress{display:block;width:min(220px,70%);height:5px;margin:12px auto;accent-color:var(--cyan);border:0;border-radius:8px;overflow:hidden;background:#303745}progress::-webkit-progress-bar{background:#303745}progress::-webkit-progress-value{background:var(--cyan)}progress::-moz-progress-bar{background:var(--cyan)}#feedback{font-size:.875rem;line-height:1.5;color:var(--muted);min-height:1.5em;margin:8px 0 0}.controls{justify-content:flex-start;gap:8px}.note{font-size:.875rem;line-height:1.5;color:var(--muted);margin:0;max-width:1100px}[hidden]{display:none!important}
@keyframes pop{50%{transform:translate(-50%,-50%) scale(1.1)}}@media(max-width:700px){main{padding:12px;gap:12px}#stage{min-height:440px}.message{bottom:18px}#hint{font-size:.875rem}.toolbar{align-items:flex-start}nav button{padding:.55rem .8rem;font-size:.875rem}.controls button{font-size:.875rem}#letters{top:38%}}
</style><link rel="stylesheet" href="interaction.css"><script src="interaction.js"></script><main><header><div class="brand">拆字試煉</div><div class="step" id="level-label">第二關 <b>人＋木 → 休</b></div></header><div class="toolbar"><a href="/">回到第一關：森</a><label>提示難度 <select id="difficulty"><option value="easy">入門・跟著做</option><option value="mid">進階・想一想</option><option value="hard">挑戰・試一試</option></select></label><nav aria-label="選擇關卡"><button data-level="0">第二關 休</button><button data-level="1">第三關 鳴</button><button data-level="2">第四關 開／關</button><button data-level="3">第五關 看</button><button data-level="4">第六關 明</button><button data-level="5">第七關 囚</button><button data-level="6">第八關 岩</button></nav></div><section id="stage"><video id="video" autoplay muted playsinline></video><div class="shade"></div><div id="content"><div id="letters"></div><div class="message"><h1 id="title"></h1><p id="hint"></p><progress id="progress" max="1" value="0" aria-label="完成進度"></progress><p id="feedback" role="status"></p></div></div></section><div class="controls"><button id="camera">開啟攝影機</button><button id="mic" hidden>開啟麥克風</button><button id="speak">聽提示</button><button id="demo">模擬動作</button><button id="reset">重玩本關</button><button id="next" hidden>下一關</button></div><p class="note">聲音關卡目前依音量回應，說話或其他聲音也可能觸發。攝影機與麥克風資料僅在瀏覽器內處理。語音提示依裝置支援提供。</p></main>
<link rel="stylesheet" href="extra-levels.css"><script src="extra-levels.js"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script><script>
const $=id=>document.getElementById(id);const levels=[{word:'休',parts:'人 木',title:'累了，在哪裡休息呢？',easy:'身體向畫面右邊的樹側靠，停留一秒。',mid:'讓畫面中的人靠著樹休息。',hard:'幫累累的人找個地方休息。',done:'人靠著樹休息，休息的休。'},{word:'鳴',parts:'口 鳥',title:'發出聲音，讓小鳥回應你',easy:'開啟麥克風，說話、唱歌或發出任何聲音，持續約一秒。',mid:'小鳥想聽見你的聲音。',hard:'用聲音叫醒小鳥吧。',done:'鳥用口發出聲音，鳥鳴的鳴。'},{word:'開／關',parts:'門',title:'請把門打開',easy:'先把雙手放在胸前，再向兩側張開；最後合攏雙手關門。',mid:'用雙手示範開門，再把門關好。',hard:'請進，再幫忙把門關好。',done:'張開、合攏：開門和關門。這一關認識字的意思。'}];
levels.push(...extraLevels);
let level=0,done=false,door=0,amount=0,lastTime=0,pose=null,camStream=null,micStream=null,audio=null,analyser=null,bytes=null,calibration=[],noise=.015,calibrated=false,micStarting=false;let previous=0;
function stopMic(){if(micStream)micStream.getTracks().forEach(t=>t.stop());micStream=null;if(audio)audio.close();audio=null;analyser=null;calibrated=false;$('mic').disabled=false;$('mic').textContent='開啟麥克風'}
function hint(){if(!done)$('hint').textContent=levels[level][$('difficulty').value]}
function openLevel(n){stopMic();level=n;done=false;door=0;amount=0;lastTime=0;resetExtra();const l=levels[n];$('level-label').innerHTML=['第二關 <b>人＋木 → 休</b>','第三關 <b>口＋鳥 → 鳴</b>','第四關 <b>開／關</b>','第五關 <b>手＋目 → 看</b>','第六關 <b>日＋月 → 明</b>','第七關 <b>囗＋人 → 囚</b>','第八關 <b>岩 − 山 → 石</b>'][n];$('letters').className='';$('letters').innerHTML=l.parts.split(' ').map(x=>'<span>'+x+'</span>').join('');$('title').textContent=l.title;hint();$('progress').value=0;$('feedback').textContent=n===1?'先開啟麥克風，保持安靜一秒。':'可使用攝影機，也可以按模擬動作試玩。';$('next').hidden=true;$('mic').hidden=n!==1;$('camera').hidden=false;$('demo').disabled=false;document.querySelectorAll('[data-level]').forEach(b=>b.classList.toggle('active',+b.dataset.level===n));if(n>=3)setupExtra();}
function finish(){done=true;clearExtraVisuals();$('letters').textContent=level===2?'關':levels[level].word;$('letters').className='solved';$('title').textContent='完成了！';$('hint').textContent=levels[level].done;$('progress').value=1;$('feedback').textContent=level===levels.length-1?'全部完成！可以回到第一關再挑戰一次。':'太棒了，準備前往下一關！';$('next').hidden=false;$('next').textContent=level===levels.length-1?'回到第一關':'下一關';$('demo').disabled=true;stopMic();}
function act(){if(done)return;if(level>=3){extraAct();return}if(level===2&&door===0){door=1;amount=0;$('letters').textContent='開';$('title').textContent='門開了！再把門關好';$('progress').value=0;$('feedback').textContent='把雙手慢慢合攏。';return}finish()}
function accumulate(active,dt){if(done)return;amount=Math.max(0,Math.min(1,amount+(active?dt:-dt*.6)));$('progress').value=amount;if(amount>=1)act()}
function results(r){handNext(r.poseLandmarks);if(done||level===1)return;const lm=r.poseLandmarks,now=performance.now(),dt=Math.min(.1,(now-lastTime)/1000||0);lastTime=now;if(!lm){document.querySelectorAll('.gesture-dot').forEach(d=>d.hidden=true);amount=0;$('progress').value=0;extraState.grab=null;$('feedback').textContent='請讓肩膀和雙手出現在鏡頭中。';return}if(level>=3){extraResults(lm,dt);return}const valid=ids=>ids.every(i=>lm[i]&&(lm[i].visibility??0)>.6);if(level===0){if(!valid([11,12,23,24])){accumulate(false,dt);$('feedback').textContent='退後一點，讓肩膀到腰部都入鏡。';return}const shoulder=(lm[11].x+lm[12].x)/2,hip=(lm[23].x+lm[24].x)/2,width=Math.max(.08,Math.abs(lm[11].x-lm[12].x)),lean=(hip-shoulder)/width;const s=$('letters').firstElementChild;if(s)s.style.transform='translateX('+Math.max(0,Math.min(35,lean*70))+'px) rotate('+Math.max(-15,Math.min(15,lean*30))+'deg)';$('feedback').textContent='向畫面右邊側靠，慢慢來。';accumulate(lean>.22,dt)}else{if(!valid([11,12,15,16])){accumulate(false,dt);$('feedback').textContent='請讓兩隻手和肩膀都入鏡。';return}const width=Math.max(.08,Math.abs(lm[11].x-lm[12].x)),gap=Math.abs(lm[15].x-lm[16].x)/width;accumulate(door===0?gap>1.8:gap<.55,dt);$('feedback').textContent=door===0?'張開雙手，維持一下。':'合攏雙手，維持一下。'}}
$('camera').onclick=async()=>{try{$('camera').disabled=true;$('feedback').textContent='正在準備攝影機…';if(!window.Pose)throw Error('模型未載入');camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=camStream;await $('video').play();pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose/'+f});pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:.55,minTrackingConfidence:.55});pose.onResults(results);$('camera').textContent='攝影機已開啟';async function frame(){try{await pose.send({image:$('video')});requestAnimationFrame(frame)}catch(e){$('feedback').textContent='追蹤中斷，請重新整理後再試。';camStream?.getTracks().forEach(t=>t.stop())}}frame()}catch(e){camStream?.getTracks().forEach(t=>t.stop());$('camera').disabled=false;$('feedback').textContent='無法開啟攝影機，請檢查權限與網路，或先使用模擬動作。'}};
$('mic').onclick=async()=>{if(micStarting)return;micStarting=true;const requestedLevel=level;try{$('mic').disabled=true;const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(level!==requestedLevel||done){stream.getTracks().forEach(t=>t.stop());return}micStream=stream;audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();analyser=audio.createAnalyser();analyser.fftSize=1024;audio.createMediaStreamSource(stream).connect(analyser);bytes=new Float32Array(analyser.fftSize);calibration=[];calibrated=false;previous=performance.now();$('mic').textContent='麥克風已開啟';$('feedback').textContent='先安靜一秒，聽聽周圍的聲音。';const began=previous;function listen(now){if(!analyser||level!==1||done)return;const dt=Math.min(.1,(now-previous)/1000);previous=now;analyser.getFloatTimeDomainData(bytes);const rms=Math.sqrt(bytes.reduce((a,v)=>a+v*v,0)/bytes.length);if(now-began<1200)calibration.push(rms);else{if(!calibrated){noise=calibration.reduce((a,b)=>a+b,0)/Math.max(1,calibration.length);calibrated=true}$('feedback').textContent='發出任何聲音，持續約一秒，讓進度條填滿。';accumulate(rms>Math.max(.018,noise*2.3),dt)}requestAnimationFrame(listen)}requestAnimationFrame(listen)}catch(e){stopMic();$('feedback').textContent='無法開啟麥克風，請允許權限，或先使用模擬動作。'}finally{micStarting=false}};
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){$('feedback').textContent='此瀏覽器未提供語音朗讀。';return}const text=done?levels[level].done:$('title').textContent+'。'+$('hint').textContent;const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.85;speechSynthesis.cancel();if(level===1&&micStream){stopMic();$('feedback').textContent='聽完提示後，再開啟麥克風。'}speechSynthesis.speak(u)};
$('demo').onclick=act;$('reset').onclick=()=>openLevel(level);$('next').onclick=()=>level===levels.length-1?location.assign('/'):openLevel(level+1);$('difficulty').onchange=hint;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>openLevel(+b.dataset.level));addEventListener('pagehide',()=>{stopMic();camStream?.getTracks().forEach(t=>t.stop())});const nextButton=$('next');nextButton.className='next-level';$('stage').append(nextButton);const handNext=createHandNext($('video'),nextButton);openLevel(0);
</script></html>
